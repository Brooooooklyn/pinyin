[package]
name = "napi-pinyin-kernels"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded SIMD text kernels for napi-pinyin"
repository = "https://github.com/Brooooooklyn/pinyin"

[features]
default = []
simd = ["dep:simdutf"]

[target.'cfg(all(not(target_family = "wasm"), any(target_arch = "aarch64", target_arch = "x86_64")))'.dependencies]
simdutf = { version = "=0.7.0", optional = true }
